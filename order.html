<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johny's Pizza — Оформлення замовлення</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">🍕 Johny's Pizza</a>
        <nav>
            <a href="index.html">Головна</a>
            <a href="menu.html">Меню</a>
            <a href="order.html" class="active">Замовити</a>
        </nav>
    </header>

    <main class="container">
        <div class="page-header">
            <span class="badge">Швидка доставка</span>
            <h2>Оформлення замовлення</h2>
            <p>Заповніть форму нижче, і наш кур'єр вирушить до вас одразу з печі</p>
        </div>

        <form class="order-form">
            <div class="form-group">
                <label>Оберіть піцу</label>
                <select required>
                    <option value="" disabled selected>Натисніть, щоб обрати...</option>
                    <option value="pizza1">Пепероні з грибами — 275 грн</option>
                    <option value="pizza2">Класична Пепероні — 255 грн</option>
                    <option value="pizza3">Піца з ковбаскою, сиром та грибами — 290 грн</option>
                </select>
            </div>

            <div class="form-group">
                <label>Кількість</label>
                <input type="number" min="1" max="20" value="1" required>
            </div>

            <div class="form-group">
                <label>Ваше ім'я</label>
                <input type="text" placeholder="Наприклад: Олександр" required>
            </div>

            <div class="form-group">
                <label>Номер телефону</label>
                <input type="tel" placeholder="+38 (0__) ___-__-__" required>
            </div>

            <div class="form-group">
                <label>Адреса доставки</label>
                <input type="text" placeholder="Вулиця, будинок, квартира" required>
            </div>

            <div class="form-group">
                <label>Побажання до замовлення</label>
                <textarea rows="3" placeholder="Додатковий сир, код домофона або коментар кур'єру..."></textarea>
            </div>

            <button type="submit" class="btn-primary full-width">Підтвердити замовлення</button>
        </form>
    </main>

</body>
</html>
